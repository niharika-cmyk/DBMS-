<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — SafeHer</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="app-frame">
  <div class="topbar">
    <a class="brand" href="../dashboard.html"><span class="dot"></span> SafeHer</a>
  </div>

  <div class="content">
    <h1 class="page-title">Location history</h1>
    <p class="page-sub">A private timeline of your check-ins, alerts, and tracking sessions.</p>

    <div id="historyList"></div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" data-page="dashboard.html" href="../dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Home
    </a>
    <a class="nav-item" href="sos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      SOS
    </a>
    <a class="nav-item" href="contacts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Contacts
    </a>
    <a class="nav-item" href="tracking.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Tracking
    </a>
    <a class="nav-item active" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      History
    </a>
  </nav>
</div>

<script src="../script.js"></script>
<script>
  guardAuth('../login.html');

  const iconFor = {
    sos: { badge: 'badge-sos', label: 'SOS' },
    safe: { badge: 'badge-safe', label: 'Safe' },
    tracking: { badge: 'badge-warn', label: 'Tracking' }
  };

  async function render() {
    const container = document.getElementById('historyList');
    try {
      const list = await getHistory();
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No activity yet. Alerts and tracking sessions will appear here.</div>';
        return;
      }
      container.innerHTML = list.map(entry => {
        const meta = iconFor[entry.type] || iconFor.tracking;
        return `
          <div class="row">
            <div class="row-avatar">
              <span class="badge ${meta.badge}" style="padding:3px 7px;">${meta.label}</span>
            </div>
            <div class="row-body">
              <div class="row-title">${entry.label}</div>
              <div class="row-sub">${entry.coords ? entry.coords + ' · ' : ''}${timeAgo(entry.time)}</div>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state">Could not load history: ${err.message}</div>`;
    }
  }

  render();
</script>
</body>
</html>
